# Đặt file này tại: .github/workflows/build-from-zip.yml (thư mục gốc repo)
# Repo chỉ cần có thêm file Xpan-Mode.zip ở thư mục gốc.
name: Build APK from zip

on:
  push:
    paths:
      - "Xpan-Mode.zip"
  workflow_dispatch:
    inputs:
      extract_to_repo:
        description: "Giải nén và commit mã nguồn vào repo (không đụng tới .github)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén zip
        run: |
          test -f Xpan-Mode.zip || { echo "Không thấy Xpan-Mode.zip ở thư mục gốc"; exit 1; }
          mkdir -p /tmp/src
          unzip -q Xpan-Mode.zip -d /tmp/src
          ls /tmp/src
          test -f /tmp/src/Xpan-Mode/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chấp nhận license Android SDK (SDK đã cài sẵn trên runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: /tmp/src/Xpan-Mode
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Xpan-Mode-debug-apk
          path: /tmp/src/Xpan-Mode/app/build/outputs/apk/debug/*.apk

      - name: Commit mã nguồn đã giải nén (tuỳ chọn)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extract_to_repo }}
        run: |
          rsync -a --exclude '.github' --exclude 'build' --exclude '.gradle' /tmp/src/Xpan-Mode/ ./
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract Xpan-Mode source from zip" || echo "Không có thay đổi"
          git push
